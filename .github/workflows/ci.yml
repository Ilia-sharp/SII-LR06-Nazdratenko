name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Зависимости (без torch — CI быстрый)
        run: pip install -r requirements-dev.txt

      - name: Тесты
        run: pytest -q

      - name: Проверки прогона (если outputs уже в репозитории)
        run: python -m src.checks

      - name: Импорт сервера (линт-проверка)
        run: python -c "import src.server; print('server OK')"
