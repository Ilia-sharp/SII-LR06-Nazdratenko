name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Зависимости
        run: pip install -r requirements-dev.txt

      - name: Тесты
        run: pytest -q

      - name: Проверка импорта пакета
        run: python -c "import src.pipeline, src.api, src.cli; print('imports OK')"
