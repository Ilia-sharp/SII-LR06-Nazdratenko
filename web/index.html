<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Рабочее место · ЛР №6 · Наздратенко</title>
<meta name="description" content="Лабораторная работа №6: генерация изображений рабочего места. Облачная модель Flux со случайным seed, архивный прогон SD-Turbo и воспроизводимый манифест.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23F4F2EC'/%3E%3Ccircle cx='32' cy='32' r='13' fill='none' stroke='%23C6532D' stroke-width='4'/%3E%3Ccircle cx='32' cy='32' r='4' fill='%23C6532D'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F2EC; --panel:#FBFAF7; --stage:#E9E5DC;
  --ink:#191713; --muted:#797267; --line:#E1DCD1; --line-2:#D3CDC0;
  --accent:#C6532D; --accent-soft:#F4E3DA;
  --ok:#4F6B4A;
  --serif:"Playfair Display",Georgia,serif;
  --sans:"Golos Text",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 15.5px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
::selection{background:var(--accent-soft);color:var(--accent)}
button{font:inherit}
img{max-width:100%}
a{color:inherit}

/* ── Шапка ─────────────────────────────────────────────────────────────── */
.top{display:flex;align-items:center;gap:20px;height:62px;padding:0 28px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:600;font-size:15px;letter-spacing:-.01em}
.brand svg{width:22px;height:22px;flex:none}
.top-meta{font-size:12.5px;color:var(--muted);margin-left:6px}
.top-actions{display:flex;align-items:center;gap:8px;margin-left:auto}
.link{background:none;border:1px solid transparent;border-radius:999px;padding:7px 13px;font-size:13px;color:var(--muted);text-decoration:none;cursor:pointer;transition:.18s;white-space:nowrap}
.link:hover{color:var(--ink);border-color:var(--line)}
.link strong{font-weight:500;color:var(--ink)}

/* ── Каркас одного экрана ──────────────────────────────────────────────── */
.app{display:grid;grid-template-columns:344px minmax(0,1fr);gap:44px;width:100%;max-width:1360px;margin:0 auto;padding:30px 28px 26px;height:calc(100vh - 63px);height:calc(100dvh - 63px);min-height:600px}
.side{display:flex;flex-direction:column;min-height:0;overflow:hidden}
h1{font:500 46px/1.02 var(--serif);letter-spacing:-.02em;margin:0 0 20px}
h1 em{font-style:italic;color:var(--accent)}
.prompt-box{position:relative}
textarea{width:100%;flex:none;min-height:118px;resize:none;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px 14px 42px;font:400 14.5px/1.55 var(--sans);color:var(--ink);transition:border-color .18s,box-shadow .18s}
textarea:focus{outline:none;border-color:var(--line-2);box-shadow:0 0 0 3px rgba(198,83,45,.1)}
.idea{position:absolute;right:9px;bottom:9px;border:1px solid var(--line);background:var(--bg);color:var(--muted);border-radius:999px;padding:6px 13px;font-size:12px;cursor:pointer;transition:color .15s,border-color .15s,background .15s}
.idea:hover{color:var(--ink);border-color:var(--line-2);background:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border:1px solid transparent;border-radius:999px;cursor:pointer;transition:background .18s,color .18s,border-color .18s,transform .12s;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn-main{width:100%;margin-top:12px;padding:15px 20px;background:var(--ink);color:#FAF8F3;font-size:15px;font-weight:500}
.btn-main:hover{background:#000}
.btn-main:disabled{opacity:.55;cursor:progress;transform:none}
.btn-main .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none}
.note{min-height:18px;margin:10px 0 0;font-size:12.5px;color:var(--muted);line-height:1.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note.is-ok{color:var(--ok)}
.note.is-err{color:var(--accent)}

.history{flex:1 1 auto;margin-top:auto;min-height:0;display:flex;flex-direction:column;padding-top:18px}
.history-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.history-head span{font-size:11.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.history-list{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:min-content;align-content:start;gap:8px;overflow:auto;scrollbar-width:thin;padding-bottom:2px}
.hitem{position:relative;padding:0;border:2px solid transparent;border-radius:11px;overflow:hidden;background:var(--stage);cursor:pointer;aspect-ratio:1/1;transition:border-color .15s,transform .15s}
.hitem:hover{transform:translateY(-1px)}
.hitem.is-active{border-color:var(--accent)}
.hitem img{width:100%;height:100%;object-fit:cover;display:block}
.hitem .badge{position:absolute;left:5px;bottom:5px;font-size:9.5px;font-weight:500;letter-spacing:.02em;padding:2px 6px;border-radius:999px;background:rgba(20,18,15,.72);color:#F6F1E9;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.history-empty{grid-column:1/-1;padding:18px 4px;font-size:12.5px;color:var(--muted)}

/* ── Сцена ─────────────────────────────────────────────────────────────── */
.stage-col{display:flex;flex-direction:column;min-height:0;gap:14px}
.stage{position:relative;flex:1;min-height:0;display:grid;place-items:center;background:var(--stage);border-radius:18px;overflow:hidden}
.stage-inner{position:relative;width:min(100%,calc(100dvh - 190px));aspect-ratio:1/1;max-height:100%;border-radius:18px;overflow:hidden;background:#201D19}
#preview{display:block;width:100%;height:100%;object-fit:cover;background:#201D19}
#preview[hidden]{display:none}
#canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#canvas[hidden]{display:none}
.stage-empty{position:absolute;inset:0;display:grid;place-items:center;padding:30px;text-align:center;color:var(--muted);font-size:13.5px;background:repeating-linear-gradient(45deg,#EFEBE2,#EFEBE2 12px,#ECE7DD 12px,#ECE7DD 24px)}
.stage-empty[hidden]{display:none}
.overlay{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;padding:16px;background:linear-gradient(180deg,rgba(20,18,15,0) 35%,rgba(20,18,15,.55));transition:opacity .3s}
.overlay[hidden]{display:none;opacity:0}
.loader{width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:rgba(20,18,15,.84);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:#F6F1E9;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.spinner{width:18px;height:18px;border-radius:50%;border:2px solid rgba(246,241,233,.25);border-top-color:#F0B49B;animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.loader-text{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1}
.loader-text b{font-weight:500;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.loader-text small{font-size:11.5px;color:#C9C1B4;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.loader .pct{font-variant-numeric:tabular-nums;color:#C9C1B4;font-size:12px;flex:none}
.btn-cancel{border:1px solid rgba(246,241,233,.3);background:transparent;color:#F6F1E9;border-radius:999px;padding:6px 12px;font-size:12px;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s;flex:none}
.btn-cancel:hover{background:rgba(246,241,233,.14);border-color:rgba(246,241,233,.55)}
.progress{height:2px;background:var(--line);border-radius:99px;overflow:hidden}
.progress-bar{height:100%;width:0;background:var(--accent);transition:width .4s ease}
.progress[hidden]{display:none}
.readout{display:flex;align-items:baseline;justify-content:space-between;gap:18px;min-height:34px;font-size:12.5px;color:var(--muted)}
.readout span{white-space:nowrap;font-variant-numeric:tabular-nums}

/* ── Манифест ──────────────────────────────────────────────────────────── */
dialog{width:min(760px,calc(100vw - 40px));max-height:80vh;padding:0;border:1px solid var(--line);border-radius:18px;background:var(--panel);color:var(--ink);box-shadow:0 40px 90px rgba(25,23,19,.3)}
dialog::backdrop{background:rgba(25,23,19,.34);backdrop-filter:blur(3px)}
.dlg-head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 22px;border-bottom:1px solid var(--line)}
.dlg-head b{font-size:14px;font-weight:600}
.dlg-close{border:none;background:none;font-size:22px;line-height:1;color:var(--muted);cursor:pointer;padding:2px 6px;border-radius:8px}
.dlg-close:hover{background:var(--line)}
dialog pre{margin:0;padding:20px 22px 24px;overflow:auto;max-height:calc(80vh - 64px);font:12.5px/1.65 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#4B453C;white-space:pre-wrap;overflow-wrap:anywhere}

/* ── Адаптив ───────────────────────────────────────────────────────────── */
@media (max-width:1000px){
  .app{grid-template-columns:300px minmax(0,1fr);gap:26px;padding:24px 20px;height:calc(100vh - 63px);height:calc(100dvh - 63px)}
  .stage-inner{width:100%}
}
@media (max-width:820px){
  .top{padding:0 18px;height:58px}
  .top-meta{display:none}
  .app{grid-template-columns:1fr;gap:22px;padding:20px 18px 32px;height:auto;min-height:0}
  .side{overflow:visible}
  h1{font-size:38px}
  .history{flex:none;margin-top:8px}
  .history-list{flex:none;overflow:visible;grid-template-columns:repeat(4,minmax(0,1fr))}
  textarea{min-height:104px}
  .stage{min-height:0}
  .stage-inner{width:100%}
  .readout{min-height:0}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <a class="brand" href="/" aria-label="На главную">
    <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
      <circle cx="16" cy="16" r="10.5" stroke="#C6532D" stroke-width="2.8"/>
      <circle cx="16" cy="16" r="3.2" fill="#C6532D"/>
    </svg>
    <span>Наздратенко</span>
  </a>
  <span class="top-meta">ЛР №6 · вариант 16</span>
  <div class="top-actions">
    <button class="link" id="manifest-open" type="button">Манифест</button>
    <a class="link" href="https://github.com/Ilia-sharp/SII-LR06-Nazdratenko" target="_blank" rel="noopener"><strong>GitHub</strong> ↗</a>
  </div>
</header>

<main class="app">
  <section class="side">
    <h1>Рабочее <em>место</em></h1>

    <div class="prompt-box">
      <textarea id="prompt" maxlength="1500" spellcheck="false" placeholder="Опишите интерьер…"></textarea>
      <button class="idea" id="idea" type="button" title="Подставить готовый промпт">Идея</button>
    </div>

    <button class="btn btn-main" id="generate" type="button"><span class="dot"></span>Сгенерировать</button>
    <p class="note" id="note"></p>

    <div class="history">
      <div class="history-head"><span>История</span><span id="history-count"></span></div>
      <div class="history-list" id="history-list"></div>
    </div>
  </section>

  <section class="stage-col">
    <div class="stage">
      <div class="stage-inner" id="stage-inner">
        <img id="preview" alt="Сгенерированное рабочее место">
        <canvas id="canvas" width="512" height="512"></canvas>
        <div class="stage-empty" id="stage-empty">Галерея появится после прогона</div>
        <div class="overlay" id="overlay" hidden>
          <div class="loader">
            <span class="spinner"></span>
            <span class="loader-text">
              <b id="overlay-text">Генерация…</b>
              <small id="overlay-hint">FLUX.1-schnell · 1024 × 1024</small>
            </span>
            <span class="pct" id="overlay-pct">0%</span>
            <button class="btn-cancel" id="cancel" type="button">Отменить</button>
          </div>
        </div>
      </div>
    </div>
    <div class="progress" id="progress" hidden><div class="progress-bar" id="bar"></div></div>
    <div class="readout">
      <span id="readout-meta">—</span>
    </div>
  </section>
</main>

<dialog id="manifest-dialog">
  <div class="dlg-head">
    <b>manifest.json</b>
    <button class="dlg-close" id="manifest-close" type="button" aria-label="Закрыть">×</button>
  </div>
  <pre id="manifest-view">загрузка…</pre>
</dialog>

<script>
"use strict";
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

/* Готовые идеи интерьера — кнопка «Идея» подставляет промпт. */
const IDEAS = [
  "Cozy workspace by the window, oak desk, warm morning light, plants, photorealistic interior photo",
  "Minimalist white desk with a laptop, concrete wall, soft daylight, shallow depth of field",
  "Scandinavian home office, light wood, linen chair, green plants, large window, interior magazine photo",
  "Loft workspace with brick wall, black metal desk, Edison lamps, evening atmosphere, photorealistic",
  "Student dorm desk, books and notes, warm lamp light, cozy and lived-in, realistic photo",
  "Modern office corner with an ultrawide monitor, ergonomic chair, city view, clean daylight",
  "Wooden desk on a glassed balcony, coffee cup, notebooks, soft sunset light, photorealistic",
  "Dark moody home office, walnut desk, brass lamp, leather chair, cinematic lighting",
  "Bright studio workspace, easel and sketches, big windows, wooden floor, airy interior",
  "Compact desk nook, floating shelves, plants, warm neutral palette, architectural photo",
  "Creative workspace with dual monitors, drawing tablet, posters, natural window light",
  "Quiet library-style office, floor-to-ceiling bookshelves, green banker lamp, wooden desk",
  "Japanese minimalist workspace, tatami, low wooden desk, paper lamp, calm natural light",
  "Industrial office with concrete ceiling, long shared table, pendant lights, plants"
];

/* Новый seed на каждую генерацию: один и тот же промпт даёт разные картинки. */
function randomSeed() {
  const a = new Uint32Array(1);
  if (window.crypto && window.crypto.getRandomValues) window.crypto.getRandomValues(a);
  else a[0] = Math.floor(Math.random() * 4294967296);
  return a[0] % 2147483647;
}

const preview = $("#preview"), canvas = $("#canvas"), ctx = canvas.getContext("2d");
let items = [], activeItem = 0, running = false, t0 = 0, timerId = null;
let creepId = null, controller = null, progressValue = 0;
let lastPreview = null, currentPrompt = "", lastGood = null, ideaIndex = -1;

/* ── Шум и превью ─────────────────────────────────────────────────────── */
function noise() {
  const w = canvas.width, h = canvas.height;
  const img = ctx.createImageData(w, h), d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const v = (Math.random() * 255) | 0;
    d[i] = v; d[i+1] = v; d[i+2] = Math.min(255, v + 14); d[i+3] = 255;
  }
  ctx.putImageData(img, 0, 0);
}
function showCanvas(on) {
  canvas.hidden = !on;
  preview.hidden = on;
  if (on) noise();
}
function drawCover(img) {
  const w = canvas.width, h = canvas.height;
  const k = Math.max(w / img.naturalWidth, h / img.naturalHeight);
  const dw = img.naturalWidth * k, dh = img.naturalHeight * k;
  ctx.drawImage(img, (w - dw) / 2, (h - dh) / 2, dw, dh);
}
function renderNoise(progress) {
  if (lastPreview && lastPreview.complete && lastPreview.naturalWidth) {
    drawCover(lastPreview);
    const a = Math.max(0, 1 - progress);
    if (a > .01) { ctx.globalAlpha = a; noise(); ctx.globalAlpha = 1; }
  } else {
    noise();
  }
}

/* ── Статус ───────────────────────────────────────────────────────────── */
function note(text, kind) {
  const el = $("#note");
  el.textContent = text;
  el.className = "note" + (kind ? " is-" + kind : "");
}
function startTimer() {
  t0 = performance.now();
  progressValue = 0.02;
  timerId = setInterval(() => {
    $("#readout-meta").textContent = ((performance.now() - t0) / 1000).toFixed(1) + " с";
  }, 100);
  creepId = setInterval(() => {
    if (progressValue < 0.9) {
      progressValue = Math.min(0.9, progressValue + 0.008);
      $("#bar").style.width = Math.round(progressValue * 100) + "%";
      $("#overlay-pct").textContent = Math.round(progressValue * 100) + "%";
    }
  }, 400);
}
function stopTimer() {
  clearInterval(timerId); timerId = null;
  clearInterval(creepId); creepId = null;
}

function setProgress(p) {
  progressValue = p;
  $("#bar").style.width = Math.min(100, Math.round(p * 100)) + "%";
  $("#overlay-pct").textContent = Math.min(100, Math.round(p * 100)) + "%";
}
function bump(p) {
  if (p > progressValue) setProgress(p);
}
function overlay(text, hint) {
  const el = $("#overlay");
  if (text === null) { el.hidden = true; $("#progress").hidden = true; return; }
  el.hidden = false;
  $("#progress").hidden = false;
  $("#overlay-text").textContent = text;
  if (hint) $("#overlay-hint").textContent = hint;
}

/* ── Данные ───────────────────────────────────────────────────────────── */
async function waitServer() {
  for (let i = 1; i <= 6; i++) {
    try {
      const r = await fetch("/api/health", {cache: "no-store"});
      if (r.ok) return await r.json();
    } catch (e) {}
    note(`Сервер просыпается… попытка ${i} из 6`);
    await new Promise(r => setTimeout(r, 9000));
  }
  throw new Error("server unavailable");
}

function itemLabel(it) {
  if (it.source === "archive") return "Архив";
  return "Flux";
}

function renderHistory() {
  const box = $("#history-list");
  box.innerHTML = "";
  $("#history-count").textContent = items.length ? String(items.length) : "";
  if (!items.length) {
    box.innerHTML = '<p class="history-empty">Здесь появятся ваши картинки.</p>';
    return;
  }
  items.forEach((it, idx) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "hitem" + (idx === activeItem ? " is-active" : "");
    b.title = it.prompt || "Без промпта";
    b.innerHTML = `<img src="${it.url}" alt="" loading="lazy">
      <span class="badge">${esc(itemLabel(it))}</span>`;
    b.addEventListener("click", () => selectItem(idx));
    box.appendChild(b);
  });
}

async function loadHistory() {
  const res = await fetch("/api/history", {cache: "no-store"});
  const data = await res.json();
  items = data.items || [];
  activeItem = 0;
  renderHistory();
  if (!items.length) {
    $("#stage-empty").hidden = false;
    preview.hidden = true;
    note("Пока пусто — нажмите «Идея» и «Сгенерировать».");
    return;
  }
  $("#stage-empty").hidden = true;
  selectItem(0);
}

function selectItem(idx) {
  if (!items[idx]) return;
  activeItem = idx;
  const it = items[idx];
  currentPrompt = it.prompt || "";
  if (currentPrompt) $("#prompt").value = currentPrompt;
  $$(".hitem").forEach((b, i) => b.classList.toggle("is-active", i === idx));

  preview.src = it.url;
  preview.hidden = false;
  canvas.hidden = true;
  $("#stage-empty").hidden = true;
  overlay(null);

  const model = it.source === "archive" ? "SD-Turbo" : (it.model || "FLUX.1-schnell");
  const dims = it.width && it.height ? `${it.width} × ${it.height}` : "";
  const bits = [model];
  if (it.seed != null) bits.push(`seed ${it.seed}`);
  if (typeof it.elapsed_sec === "number") bits.push(`${it.elapsed_sec.toFixed(1)} с`);
  $("#readout-meta").textContent = bits.join(" · ");
  lastGood = {src: it.url, meta: $("#readout-meta").textContent};
}

$("#prompt").addEventListener("input", () => {
  currentPrompt = $("#prompt").value.trim();
  $$(".hitem").forEach(b => b.classList.remove("is-active"));
});

$("#idea").addEventListener("click", () => {
  if (!IDEAS.length) return;
  ideaIndex = (ideaIndex + 1) % IDEAS.length;
  const prompt = IDEAS[ideaIndex];
  $("#prompt").value = prompt;
  currentPrompt = prompt;
  note("Идея подставлена — можно генерировать.");
  $("#prompt").focus();
});

async function loadManifest() {
  const view = $("#manifest-view");
  try {
    const m = await (await fetch("/api/manifest")).json();
    view.textContent = JSON.stringify(m, null, 2);
  } catch (e) {
    view.textContent = "manifest.json ещё не создан.\nЗапустите: python -m src.generate --prompts prompts.txt --out outputs/";
  }
}

/* ── Генерация ────────────────────────────────────────────────────────── */
async function generate() {
  if (running) return;
  const prompt = $("#prompt").value.trim();
  if (!prompt) { note("Напишите промпт или нажмите «Идея».", "err"); $("#prompt").focus(); return; }

  running = true;
  const btn = $("#generate");
  btn.disabled = true;
  btn.innerHTML = "<span class=\"dot\"></span>Генерирую…";
  note("Запрос отправлен…");
  overlay("Готовим модель…", "FLUX.1-schnell · 1024 × 1024");
  setProgress(0);
  startTimer();
  lastPreview = null;
  showCanvas(true);

  controller = new AbortController();
  try {
    const seed = randomSeed();
    const res = await fetch("/api/generate", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({prompt, seed, mode: "auto"}),
      signal: controller.signal
    });
    if (!res.ok) {
      let msg = `HTTP ${res.status}`;
      try { const j = await res.json(); msg = j.detail || msg; } catch (e) {}
      throw new Error(msg);
    }

    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream: true});
      let i;
      while ((i = buf.indexOf("\n\n")) >= 0) {
        const chunk = buf.slice(0, i).trim();
        buf = buf.slice(i + 2);
        if (chunk.startsWith("data:")) handleEvent(JSON.parse(chunk.slice(5).trim()));
      }
    }
  } catch (err) {
    if (err && err.name === "AbortError") {
      note("Генерация отменена", "");
    } else {
      note("Не получилось: " + err.message, "err");
    }
    overlay(null);
    restoreLast();
  } finally {
    running = false;
    controller = null;
    stopTimer();
    btn.disabled = false;
    btn.innerHTML = "<span class=\"dot\"></span>Сгенерировать";
  }
}

function paintLastScene() {
  if (items[activeItem]) { selectItem(activeItem); return; }
  preview.src = "";
  preview.hidden = true;
  canvas.hidden = true;
  $("#stage-empty").hidden = false;
  $("#readout-meta").textContent = "—";
}

function restoreLast() {
  if (!lastGood) { paintLastScene(); return; }
  preview.src = lastGood.src;
  preview.hidden = false;
  canvas.hidden = true;
  $("#stage-empty").hidden = true;
  $("#readout-meta").textContent = lastGood.meta;
}

function handleEvent(ev) {
  switch (ev.type) {
    case "meta":
      note(ev.note || "Генерация…");
      if (ev.model_id) {
        const size = ev.width && ev.height ? `${ev.width} × ${ev.height}` : "";
        overlay("Готовим модель…", [ev.model_id, size].filter(Boolean).join(" · "));
      }
      break;

    case "stage":
      if (ev.message) overlay(ev.message);
      if (ev.stage === "load") bump(.08);
      if (ev.stage === "encode") bump(.16);
      if (ev.stage === "vae") bump(.92);
      if (ev.stage === "save") bump(.97);
      if (ev.stage === "cloud") bump(.2);
      break;

    case "step": {
      const frac = ev.step / ev.steps;
      setProgress(.16 + frac * .72);
      overlay(`Шаг ${ev.step} из ${ev.steps}`);
      renderNoise(frac * .85);
      break;
    }

    case "preview":
      if (ev.data_url) {
        const im = new Image();
        im.onload = () => { lastPreview = im; renderNoise(.5); };
        im.src = ev.data_url;
      }
      break;

    case "result": {
      stopTimer();
      setProgress(1);
      overlay(null);
      preview.src = ev.url;
      preview.hidden = false;
      canvas.hidden = true;
      $("#stage-empty").hidden = true;
      const secs = typeof ev.elapsed_sec === "number" ? ev.elapsed_sec.toFixed(1) + " с" : "—";
      const seed = Number.isFinite(ev.seed) ? ev.seed : "—";
      const modelName = ev.model || (ev.mode === "cloud" ? "FLUX.1-schnell" : "SD-Turbo");
      $("#readout-meta").textContent =
        [modelName, `seed ${seed}`, secs].filter(Boolean).join(" · ");
      note(`Готово · ${secs} · ${modelName}`, "ok");

      const entry = {
        file: ev.file,
        url: ev.url,
        prompt: ev.prompt || currentPrompt,
        seed: ev.seed,
        model: modelName,
        mode: ev.mode,
        elapsed_sec: ev.elapsed_sec,
        width: ev.width,
        height: ev.height,
        source: "live"
      };
      items = [entry, ...items.filter(i => i.file !== entry.file)];
      activeItem = 0;
      renderHistory();
      lastGood = {src: ev.url, meta: $("#readout-meta").textContent};
      break;
    }

    case "error":
      note(ev.message || "Ошибка генерации", "err");
      overlay(null);
      paintLastScene();
      break;

    case "end":
      if (!ev.count) overlay(null);
      break;
  }
}

$("#generate").addEventListener("click", generate);

$("#cancel").addEventListener("click", () => {
  if (controller) { note("Отменяю…", ""); controller.abort(); }
});

/* ── Манифест ─────────────────────────────────────────────────────────── */
$("#manifest-open").addEventListener("click", () => $("#manifest-dialog").showModal());
$("#manifest-close").addEventListener("click", () => $("#manifest-dialog").close());
$("#manifest-dialog").addEventListener("click", e => {
  if (e.target === $("#manifest-dialog")) $("#manifest-dialog").close();
});

/* ── Старт ────────────────────────────────────────────────────────────── */
(async () => {
  try { await waitServer(); } catch (e) { note("Сервер недоступен. Обновите страницу.", "err"); return; }
  try { await loadHistory(); } catch (e) { note("Не удалось загрузить историю: " + e.message, "err"); }
  loadManifest();
})();
</script>
</body>
</html>
